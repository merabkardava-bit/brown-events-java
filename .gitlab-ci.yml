stages:
  - build
  - test
  - docker

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE
  DOCKER_HOST: tcp://localhost:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

backend:build:
  stage: build
  image: maven:3.8-openjdk-11
  script:
    - mvn -f backend/pom.xml clean package -DskipTests
  artifacts:
    paths:
      - backend/target/*.jar
  cache:
    paths:
      - .m2/repository

backend:test:
  stage: test
  image: maven:3.8-openjdk-11
  services:
    - postgres:14
  variables:
    POSTGRES_DB: brownevents_test
    POSTGRES_USER: brownevents
    POSTGRES_PASSWORD: brownevents
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres/brownevents_test
  script:
    - mvn -f backend/pom.xml test

frontend:build:
  stage: build
  image: node:18
  script:
    - cd frontend && npm ci && npm run build
  artifacts:
    paths:
      - frontend/dist/

docker:backend:
  stage: docker
  image: docker:28.5.2
  services:
    - name: docker:28.5.2-dind
      command: ["--tls=false"]
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $DOCKER_IMAGE/backend:$CI_COMMIT_SHORT_SHA ./backend
    - docker push $DOCKER_IMAGE/backend:$CI_COMMIT_SHORT_SHA
  only:
    - main

docker:frontend:
  stage: docker
  image: docker:28.5.2
  services:
    - name: docker:28.5.2-dind
      command: ["--tls=false"]
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $DOCKER_IMAGE/frontend:$CI_COMMIT_SHORT_SHA ./frontend
    - docker push $DOCKER_IMAGE/frontend:$CI_COMMIT_SHORT_SHA
  only:
    - main

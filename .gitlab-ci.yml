stages:
  - build
  - test
  - docker

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE
  DOCKER_HOST: tcp://localhost:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

backend:build:
  stage: build
  image: maven:3.8-openjdk-11
  script:
    - mvn -f backend/pom.xml clean package -DskipTests
  artifacts:
    paths:
      - backend/target/*.jar
  cache:
    paths:
      - .m2/repository

backend:test:
  stage: test
  image: maven:3.8-openjdk-11
  services:
    - postgres:14
  variables:
    POSTGRES_DB: brownevents_test
    POSTGRES_USER: brownevents
    POSTGRES_PASSWORD: brownevents
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres/brownevents_test
  script:
    - mvn -f backend/pom.xml test

frontend:build:
  stage: build
  image: node:18
  script:
    - cd frontend && npm ci && npm run build
  artifacts:
    paths:
      - frontend/dist/

e2e:
  stage: test
  image: maven:3.8-openjdk-11
  services:
    - name: docker:28.5.2-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    frontend.url: "http://docker:3000"
  before_script:
    - apt-get update && apt-get install -y docker-compose curl
  script:
    - docker-compose up -d --build
    # Wait for backend and frontend services to be healthy and responsive
    - |
      echo "Waiting for services to become ready..."
      for i in $(seq 1 60); do
        if curl -s -f http://docker:3000 > /dev/null && curl -s -f http://docker:8080/actuator/health > /dev/null; then
          echo "All services are up and healthy!"
          break
        fi
        echo "Waiting for services... ($i/60)"
        sleep 2
      done
    # Run Playwright Java E2E suite
    - mvn -f backend/pom.xml test -Dgroups=e2e -Dfrontend.url=http://docker:3000
  after_script:
    - docker-compose down -v || true
  artifacts:
    when: on_failure
    paths:
      - backend/target/e2e-screenshots/
    expire_in: 7 days

docker:backend:
  stage: docker
  image: docker:28.5.2
  services:
    - name: docker:28.5.2-dind
      command: ["--tls=false"]
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $DOCKER_IMAGE/backend:$CI_COMMIT_SHORT_SHA ./backend
    - docker push $DOCKER_IMAGE/backend:$CI_COMMIT_SHORT_SHA
  only:
    - main

docker:frontend:
  stage: docker
  image: docker:28.5.2
  services:
    - name: docker:28.5.2-dind
      command: ["--tls=false"]
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $DOCKER_IMAGE/frontend:$CI_COMMIT_SHORT_SHA ./frontend
    - docker push $DOCKER_IMAGE/frontend:$CI_COMMIT_SHORT_SHA
  only:
    - main
